name: Process Slack queue

on:
  schedule:
    # Offset from the start of the hour, when GitHub Actions is busiest.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fo-monthly-bulletin-slack-queue
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SLACK_CHANNEL_ID: C0AFA7FR5EZ
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run queue processor tests
        run: node --test actions/process-slack-queue.test.mjs

      - name: Process queued requests
        run: node actions/process-slack-queue.mjs
